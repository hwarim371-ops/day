name: Camping cloud job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Authenticated Apps Script job ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: camping-drive-worker
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run authenticated job
        run: python -m cloud.runner
        env:
          JOB_ID: ${{ inputs.job_id }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}

